<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This website will launch on January 1st, 2027.">
  <title>Launching January 1st, 2027</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #101827;
      color: #f6f2ec;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 1050px; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.5vw, 4rem);
      font-weight: 700;
      line-height: 1.3;
    }
    .notice {
      margin-top: 38px;
      font-size: clamp(1rem, 1.55vw, 1.25rem);
      line-height: 1.6;
      color: #e7e4e1;
    }
    .notice p { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>This website will launch on January 1st 2027</h1>
    <section class="notice" aria-label="Careers notice">
      <p><strong>We are looking for an Office Manager.</strong></p>
      <p>Interested in the position? Send us your resume.</p>
      <!-- When ready, add your real email address here, e.g.:
      <p>Email: <a href="mailto:YOUR_EMAIL">YOUR_EMAIL</a></p>
      -->
    </section>
  </main>
</body>
</html>
